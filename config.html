<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  .pd-dialog {
    padding: 18px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--color-text-primary, #e5e7eb);
    width: 600px;
    box-sizing: border-box;
    overflow-x: hidden;
  }
  .pd-dialog * { box-sizing: border-box; }
  .pd-hidden { display: none !important; }

  /* ---- Status card ---- */
  .pd-status-card {
    display: flex; align-items: center; gap: 16px;
    padding: 16px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    background: linear-gradient(135deg, rgba(100,100,100,0.10) 0%, rgba(80,80,80,0.05) 100%);
    color: var(--color-text-primary, #222);
  }
  .pd-status-card.connected {
    background: linear-gradient(135deg, rgba(34,197,94,0.15) 0%, rgba(34,197,94,0.05) 100%);
    border-color: rgba(34,197,94,0.2);
  }
  .pd-status-icon {
    display: flex; align-items: center; justify-content: center;
    width: 52px; height: 52px; border-radius: 12px;
    background: rgba(255,255,255,0.05); flex-shrink: 0;
  }
  .pd-status-icon svg { width: 30px; height: 30px; }
  .pd-status-body { flex: 1; min-width: 0; }
  .pd-status-title { font-weight: 600; font-size: 1.05rem; color: var(--color-text-primary, #222); margin-bottom: 2px; }
  .pd-status-card.connected .pd-status-title { color: #22c55e; }
  .pd-status-sub { font-size: 0.82rem; color: var(--color-text-secondary, #94a3b8); }
  .pd-status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 999px;
    background: rgba(148,163,184,0.15); color: var(--color-text-secondary, #94a3b8);
    font-size: 0.78rem; font-weight: 500; flex-shrink: 0;
  }
  .pd-status-card.connected .pd-status-badge { background: rgba(34,197,94,0.15); color: #22c55e; }
  .pd-status-badge .pd-pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pd-pulse 2s ease-in-out infinite; }
  @keyframes pd-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.9); } }

  /* ---- Cards ---- */
  .pd-card {
    margin-top: 12px;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    background: rgba(255,255,255,0.02);
    overflow: hidden;
  }
  .pd-card-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-weight: 500; font-size: 0.95rem;
    color: var(--color-text-primary, #222);
  }
  .pd-card-header > svg { color: var(--color-text-secondary, #888); width: 18px; height: 18px; }
  .pd-card-title { flex: 1; }
  .pd-card-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }

  /* License pill (firmware header) */
  .pd-license {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em;
    background: color-mix(in srgb, #9ca3af 15%, transparent);
    color: var(--color-text-secondary, #888);
  }
  .pd-license-dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; flex: 0 0 auto; }
  .pd-license--ok { background: color-mix(in srgb, #22c55e 15%, transparent); color: #22c55e; }
  .pd-license--ok .pd-license-dot { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.18); }
  .pd-license--warn { background: color-mix(in srgb, #f59e0b 15%, transparent); color: #f59e0b; }
  .pd-license--warn .pd-license-dot { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.18); }

  .pd-hint { font-size: 0.85rem; color: var(--color-text-secondary, #666); margin: 0; line-height: 1.45; }
  .pd-row { display: flex; gap: 8px; align-items: center; }
  .pd-input {
    flex: 1; height: 40px; padding: 0 13px; border-radius: 8px; font-size: 0.9rem; letter-spacing: 0.02em;
    background: var(--color-surface-muted, rgba(255,255,255,0.04));
    border: 1px solid var(--color-border, rgba(255,255,255,0.1));
    color: var(--color-text-primary, #eee);
  }
  .pd-input:focus { outline: none; border-color: var(--color-accent, #4a90e2); }

  .pd-btn {
    height: 40px; padding: 0 18px; border-radius: 8px; font-size: 0.86rem; font-weight: 500;
    cursor: pointer; white-space: nowrap; transition: filter .15s, background .15s;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .pd-btn.sm { height: 32px; padding: 0 13px; font-size: 0.8rem; border-radius: 6px; }
  .pd-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .pd-btn-primary { background: var(--color-accent, #4a90e2) !important; border: 1px solid var(--color-accent, #4a90e2) !important; color: #fff !important; }
  .pd-btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
  .pd-btn-secondary { background: var(--color-accent, #4a90e2) !important; border: 1px solid var(--color-accent, #4a90e2) !important; color: #fff !important; }
  .pd-btn-secondary:hover:not(:disabled) { filter: brightness(1.08); }

  /* Firmware body (mirrors AutoDustBoot) */
  .pd-fw-info { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 34px; }
  .pd-fw-status { font-size: 0.9rem; color: var(--color-text-primary, #222); }
  .pd-fw-status.muted { color: var(--color-text-secondary, #94a3b8); }
  .pd-fw-status b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .pd-fw-status .avail { color: var(--color-accent, #4a90e2); }
  .pd-fw-actions { display: flex; gap: 8px; flex-wrap: nowrap; flex-shrink: 0; }

  .pd-progress { height: 6px; border-radius: 3px; background: var(--color-surface-muted, rgba(255,255,255,0.08)); overflow: hidden; }
  .pd-progress > div { height: 100%; width: 0%; background: var(--color-accent, #4a90e2); transition: width .25s ease; }
  .pd-progress-label { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; font-size: 0.78rem; color: var(--color-text-secondary, #666); }

  .pd-msg { font-size: 0.82rem; padding: 9px 11px; border-radius: 8px; }
  .pd-msg.error { color: #ef4444; background: rgba(239,68,68,0.12); }
  .pd-msg.success { color: #22c55e; background: rgba(34,197,94,0.12); }
</style>
</head>
<body>
<div class="pd-dialog">

  <!-- Status -->
  <div id="statusCard" class="pd-status-card">
    <div class="pd-status-icon">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="1" width="18" height="26" rx="4" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
        <rect x="8" y="4" width="12" height="6" rx="1.5" fill="#0d9488" stroke="#14b8a6" stroke-width="0.5"/>
        <line x1="9.5" y1="6" x2="15" y2="6" stroke="#5eead4" stroke-width="1" stroke-linecap="round"/>
        <line x1="9.5" y1="8" x2="13" y2="8" stroke="#5eead4" stroke-width="1" stroke-linecap="round"/>
        <circle cx="14" cy="18" r="5.5" fill="#718096" stroke="#a0aec0" stroke-width="1"/>
        <circle cx="14" cy="18" r="2.5" fill="#4a5568" stroke="#718096" stroke-width="0.5"/>
        <circle cx="14" cy="13.5" r="1" fill="#f59e0b"/>
        <rect x="6" y="11" width="2.5" height="2" rx="0.5" fill="#f59e0b"/>
        <rect x="19.5" y="11" width="2.5" height="2" rx="0.5" fill="#f59e0b"/>
      </svg>
    </div>
    <div class="pd-status-body">
      <div class="pd-status-title" id="statusTitle">Checking…</div>
      <div class="pd-status-sub" id="statusSub"></div>
    </div>
    <div id="statusBadge" class="pd-status-badge pd-hidden"><span class="pd-pulse"></span><span id="statusBadgeText"></span></div>
  </div>

  <!-- Activation (only shown when connected & not activated) -->
  <div id="activationCard" class="pd-card pd-hidden">
    <div class="pd-card-header">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
      <span class="pd-card-title">Activation</span>
    </div>
    <div class="pd-card-body">
      <p class="pd-hint">Enter the Installation ID that came with your pendant.</p>
      <div class="pd-row">
        <input id="installationId" class="pd-input" type="text" placeholder="Installation ID" autocomplete="off">
        <button id="activateBtn" class="pd-btn pd-btn-primary">Activate</button>
      </div>
      <div id="activationMsg" class="pd-msg pd-hidden"></div>
    </div>
  </div>

  <!-- Firmware -->
  <div class="pd-card">
    <div class="pd-card-header">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span class="pd-card-title">Firmware Update</span>
      <span id="licensePill" class="pd-license"><span class="pd-license-dot"></span><span id="licenseText">Checking…</span></span>
    </div>
    <div class="pd-card-body">
      <div id="fwInfoRow" class="pd-fw-info">
        <div id="fwStatus" class="pd-fw-status muted">Checking…</div>
        <div class="pd-fw-actions">
          <button id="checkBtn" class="pd-btn pd-btn-secondary sm pd-hidden">Check for updates</button>
          <button id="updateBtn" class="pd-btn pd-btn-primary sm pd-hidden">Update</button>
          <button id="flashFileBtn" class="pd-btn pd-btn-secondary sm">Flash from file…</button>
          <input id="fwFile" type="file" accept=".bin" style="display:none">
        </div>
      </div>

      <div id="fwProgressBlock" class="pd-hidden">
        <div class="pd-progress"><div id="fwBar"></div></div>
        <div class="pd-progress-label"><span id="fwStatusText">Starting…</span><span id="fwPct">0%</span></div>
      </div>

      <div id="fwMsg" class="pd-msg pd-hidden"></div>
    </div>
  </div>

</div>

<script>
(function () {
  var FALLBACK_PORT = __SERVER_PORT__;
  var BASE_URL = (function () {
    if (window.ncSender && typeof window.ncSender.getApiBaseUrl === 'function') {
      return window.ncSender.getApiBaseUrl(FALLBACK_PORT);
    }
    return '';
  })();

  var $ = function (id) { return document.getElementById(id); };
  function show(el, on) { el.classList[on ? 'remove' : 'add']('pd-hidden'); }
  function setMsg(el, text, kind) {
    if (!text) { show(el, false); return; }
    el.textContent = text; el.className = 'pd-msg ' + (kind || 'error'); show(el, true);
  }

  var state = { connected: false, licensed: false, otaReady: false, version: '', latest: '', updateAvail: false, updating: false };
  var statusTimer = null;

  async function loadStatus() {
    try {
      var r = await fetch(BASE_URL + '/api/pendant/status');
      if (!r.ok) return;
      var d = await r.json();
      var usb = d.usbPendant;
      state.connected = !!usb;
      state.licensed = !!(usb && usb.licensed);
      state.otaReady = !!d.otaReady;
      state.version = usb && usb.version ? usb.version : '';
      state.kind = d.activeConnectionType === 'espnow' ? 'Wireless' : 'USB';
      render();
    } catch (e) { /* transient */ }
  }

  function render() {
    var card = $('statusCard'), badge = $('statusBadge');
    if (state.connected) {
      card.className = 'pd-status-card connected';
      $('statusTitle').textContent = 'Pendant connected';
      $('statusSub').textContent = state.kind + (state.version ? ' · v' + state.version : '');
      $('statusBadgeText').textContent = state.kind; show(badge, true);
    } else {
      card.className = 'pd-status-card';
      $('statusTitle').textContent = 'Pendant not connected';
      $('statusSub').textContent = 'Plug in the pendant or pair it in the Wireless USB dialog';
      show(badge, false);
    }

    // License pill (firmware header)
    var pill = $('licensePill'), pillText = $('licenseText');
    if (!state.connected) { pill.className = 'pd-license'; pillText.textContent = 'No pendant'; }
    else if (state.licensed) { pill.className = 'pd-license pd-license--ok'; pillText.textContent = 'Activated'; }
    else { pill.className = 'pd-license pd-license--warn'; pillText.textContent = 'Not activated'; }

    // Activation card only when there's something to do
    show($('activationCard'), state.connected && !state.licensed);

    // Firmware status line + actions
    if (state.updating) return; // don't disturb progress view
    var fw = $('fwStatus');
    // Once an update is available, the Update button replaces Check for updates.
    show($('checkBtn'), state.connected && !state.updateAvail);
    show($('updateBtn'), state.connected && state.updateAvail);
    var cls, html;
    if (!state.connected) {
      cls = 'pd-fw-status muted';
      html = 'Connect the pendant to check for updates.';
    } else if (state.updateAvail && state.latest) {
      cls = 'pd-fw-status';
      html = 'Current <b>v' + state.version + '</b> · <span class="avail">v' + state.latest + ' available</span>';
    } else {
      cls = 'pd-fw-status';
      html = 'Current <b>v' + (state.version || '—') + '</b>' + (state.checked ? ' · up to date' : '');
    }
    // Only touch the DOM when the content actually changes — rewriting innerHTML
    // on every 3s poll rebuilds the nodes and makes the text flicker.
    if (fw._cls !== cls) { fw.className = cls; fw._cls = cls; }
    if (fw._html !== html) { fw.innerHTML = html; fw._html = html; }
  }

  // ---- Activation ----
  $('activateBtn').addEventListener('click', async function () {
    var id = $('installationId').value.trim();
    if (!id) return;
    var btn = $('activateBtn');
    btn.disabled = true; btn.textContent = 'Activating…'; setMsg($('activationMsg'), '');
    try {
      var r = await fetch(BASE_URL + '/api/pendant/activate-usb', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ installationId: id })
      });
      if (!r.ok) { var e = await r.json().catch(function(){return{};}); throw new Error(e.error || e.message || ('Activation failed (HTTP ' + r.status + ')')); }
      $('installationId').value = '';
      await loadStatus();
    } catch (e) { setMsg($('activationMsg'), e.message || 'Activation failed', 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Activate'; }
  });
  $('installationId').addEventListener('keyup', function (e) { if (e.key === 'Enter') $('activateBtn').click(); });

  // ---- Firmware ----
  $('checkBtn').addEventListener('click', async function () {
    var btn = $('checkBtn');
    btn.disabled = true; btn.textContent = 'Checking…'; setMsg($('fwMsg'), '');
    try {
      var r = await fetch(BASE_URL + '/api/pendant/firmware/check');
      if (!r.ok) { var e = await r.json().catch(function(){return{};}); throw new Error(e.error || 'Check failed'); }
      var info = await r.json();
      state.checked = true;
      state.updateAvail = !!(info.updateAvailable && info.latestVersion);
      state.latest = info.latestVersion || '';
      render();
    } catch (e) { setMsg($('fwMsg'), e.message || 'Could not check for updates', 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Check for updates'; }
  });

  $('updateBtn').addEventListener('click', function () { runFirmware('/api/pendant/firmware/update', null); });
  $('flashFileBtn').addEventListener('click', function () { $('fwFile').click(); });
  $('fwFile').addEventListener('change', async function () {
    var f = $('fwFile').files && $('fwFile').files[0];
    $('fwFile').value = '';
    if (!f) return;
    var buf = await f.arrayBuffer();
    runFirmware('/api/pendant/firmware/flash-file', buf);
  });

  function beginFirmware() {
    state.updating = true;
    show($('fwInfoRow'), false); show($('fwProgressBlock'), true);
    $('fwBar').style.width = '0%'; $('fwPct').textContent = '0%'; $('fwStatusText').textContent = 'Starting…'; setMsg($('fwMsg'), '');
  }
  function endFirmware() { state.updating = false; show($('fwProgressBlock'), false); show($('fwInfoRow'), true); render(); }

  async function runFirmware(path, body) {
    beginFirmware();
    try {
      var opts = body
        ? { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: body }
        : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' };
      var r = await fetch(BASE_URL + path, opts);
      if (!r.ok || !r.body) { var e = await r.json().catch(function(){return{};}); throw new Error(e.error || 'Firmware update failed'); }
      var reader = r.body.getReader(), decoder = new TextDecoder(), buffer = '';
      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        var lines = buffer.split('\n'); buffer = lines.pop() || '';
        for (var i = 0; i < lines.length; i++) {
          if (lines[i].indexOf('data: ') !== 0) continue;
          var ev; try { ev = JSON.parse(lines[i].substring(6)); } catch (e) { continue; }
          if (ev.type === 'progress') {
            var pct = ev.percent || 0;
            $('fwBar').style.width = pct + '%'; $('fwPct').textContent = pct + '%';
            $('fwStatusText').textContent = ev.status || 'Flashing firmware…';
          } else if (ev.type === 'complete') {
            $('fwBar').style.width = '100%'; $('fwPct').textContent = '100%';
            state.updateAvail = false; endFirmware();
            setMsg($('fwMsg'), 'Firmware updated' + (ev.version ? ' to v' + ev.version : '') + '. The pendant is rebooting.', 'success');
            return;
          } else if (ev.type === 'error') { throw new Error(ev.message || 'Firmware update failed'); }
        }
      }
      endFirmware();
    } catch (e) { endFirmware(); setMsg($('fwMsg'), e.message || 'Firmware update failed', 'error'); }
  }

  loadStatus();
  statusTimer = setInterval(function () { if (!state.updating) loadStatus(); }, 3000);
  window.addEventListener('beforeunload', function () { if (statusTimer) clearInterval(statusTimer); });
})();
</script>
</body>
</html>
