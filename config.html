<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --accent: #3b82f6;
    --accent-hover: #2f6fe0;
    --green: #22c55e;
    --amber: #d9a406;
    --red: #ef4444;
    --panel: rgba(148,163,184,0.06);
    --panel-border: rgba(148,163,184,0.16);
    --text: #e8eaed;
    --muted: rgba(232,234,237,0.6);
    --field-h: 40px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; color: var(--text); background: transparent; font-size: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .content { display: flex; flex-direction: column; gap: 20px; padding: 22px; }

  /* ---- Status ---- */
  .status-card {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
  }
  .status-card.ok { border-color: rgba(34,197,94,0.35); background: rgba(34,197,94,0.07); }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #6b7280; flex: none; }
  .status-card.ok .status-dot { background: var(--green); box-shadow: 0 0 0 4px rgba(34,197,94,0.15); }
  .status-main { flex: 1; min-width: 0; }
  .status-title { font-weight: 600; }
  .status-sub { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .status-badge { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .status-card.ok .status-badge { color: var(--green); }

  /* ---- Sections ---- */
  .block { display: flex; flex-direction: column; gap: 12px; }
  .block + .block { padding-top: 20px; border-top: 1px solid var(--panel-border); }
  .block-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .hint { font-size: 0.82rem; color: var(--muted); margin: 0; line-height: 1.45; }

  /* ---- Fields + buttons (aligned heights) ---- */
  .row { display: flex; gap: 8px; align-items: center; }
  .row.end { justify-content: flex-end; }
  .text {
    flex: 1; height: var(--field-h); padding: 0 13px; border-radius: 9px; font-size: 0.9rem; letter-spacing: 0.02em;
    background: rgba(148,163,184,0.10); border: 1px solid var(--panel-border); color: inherit;
  }
  .text:focus { outline: none; border-color: var(--accent); background: rgba(148,163,184,0.14); }
  input[type=file].text { padding: 8px 12px; line-height: 1.4; }

  .btn {
    height: var(--field-h); padding: 0 18px; border-radius: 9px; font-size: 0.86rem; font-weight: 600;
    border: 1px solid transparent; cursor: pointer; color: inherit; background: transparent; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .15s, border-color .15s, opacity .15s;
  }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.sm { height: 34px; padding: 0 13px; font-size: 0.8rem; border-radius: 8px; }
  .btn.full { width: 100%; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn.ghost { border-color: var(--panel-border); color: var(--text); }
  .btn.ghost:hover:not(:disabled) { border-color: var(--accent); }
  .btn.danger { border-color: rgba(239,68,68,0.5); color: var(--red); }
  .btn.danger:hover:not(:disabled) { background: rgba(239,68,68,0.12); }

  .link-btn {
    align-self: flex-start; background: none; border: none; padding: 0; cursor: pointer;
    color: var(--accent); font-size: 0.82rem; font-weight: 500;
  }
  .link-btn:hover { text-decoration: underline; }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 999px; font-size: 0.74rem; font-weight: 700; }
  .pill.green { color: var(--green); background: rgba(34,197,94,0.12); }

  .licensed-row { display: flex; align-items: center; justify-content: space-between; }

  /* ---- Firmware ---- */
  .fw-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .fw-current { font-size: 0.9rem; }
  .fw-current b { font-weight: 700; }
  .fw-latest { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .flash-panel { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
  .progress { height: 8px; border-radius: 6px; background: rgba(148,163,184,0.18); overflow: hidden; }
  .progress > div { height: 100%; width: 0%; background: var(--accent); transition: width .2s ease; }

  .msg { font-size: 0.82rem; padding: 9px 11px; border-radius: 8px; }
  .msg.error { color: var(--red); background: rgba(239,68,68,0.12); }
  .msg.success { color: var(--green); background: rgba(34,197,94,0.12); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="content">

  <!-- Status -->
  <div id="statusCard" class="status-card">
    <div class="status-dot"></div>
    <div class="status-main">
      <div class="status-title" id="statusTitle">Checking…</div>
      <div class="status-sub" id="statusSub"></div>
    </div>
    <div class="status-badge" id="statusBadge"></div>
  </div>

  <!-- Activation -->
  <section class="block" id="activationSection">
    <div class="block-title">Activation</div>
    <p id="notConnectedNote" class="hint hidden">Connect the pendant to activate or update it.</p>

    <div id="activateBlock" class="hidden" style="display:flex; flex-direction:column; gap:12px;">
      <p class="hint">Enter the Installation ID that came with your pendant.</p>
      <div class="row">
        <input id="installationId" class="text" type="text" placeholder="Installation ID" autocomplete="off">
        <button id="activateBtn" class="btn primary">Activate</button>
      </div>
    </div>

    <div id="licensedBlock" class="hidden licensed-row">
      <span class="pill green">✓ Licensed</span>
      <button id="deactivateBtn" class="btn danger sm">Deactivate</button>
    </div>

    <div id="activationMsg" class="msg hidden"></div>
  </section>

  <!-- Firmware -->
  <section class="block" id="firmwareSection">
    <div class="block-title">Firmware</div>

    <div id="fwIdle" style="display:flex; flex-direction:column; gap:12px;">
      <div class="fw-head">
        <div>
          <div class="fw-current">Current <b id="fwCurrent">—</b></div>
          <div class="fw-latest" id="fwLatest"></div>
        </div>
        <button id="checkBtn" class="btn ghost sm">Check for updates</button>
      </div>

      <button id="updateBtn" class="btn primary full hidden">Update to <span id="fwUpdateVer"></span></button>

      <button id="flashToggle" class="link-btn">Flash from file…</button>
      <div id="flashPanel" class="flash-panel hidden">
        <input id="fwFile" type="file" accept=".bin" class="text">
        <p id="otaNote" class="hint hidden">Firmware update needs the pendant connected directly by USB cable.</p>
        <div class="row end">
          <button id="flashFileBtn" class="btn ghost sm" disabled>Flash file</button>
        </div>
      </div>
    </div>

    <div id="fwProgressBlock" class="hidden" style="display:flex; flex-direction:column; gap:10px;">
      <div class="hint" id="fwStatusText">Starting…</div>
      <div class="progress"><div id="fwBar"></div></div>
      <div class="row end">
        <button id="fwCancelBtn" class="btn danger sm">Cancel</button>
      </div>
    </div>

    <div id="fwMsg" class="msg hidden"></div>
  </section>

</div>

<script>
(function () {
  var FALLBACK_PORT = __SERVER_PORT__;
  var BASE_URL = (function () {
    if (window.ncSender && typeof window.ncSender.getApiBaseUrl === 'function') {
      return window.ncSender.getApiBaseUrl(FALLBACK_PORT);
    }
    return '';
  })();

  var $ = function (id) { return document.getElementById(id); };
  function show(el, on) { el.classList[on ? 'remove' : 'add']('hidden'); }
  function setMsg(el, text, kind) {
    if (!text) { show(el, false); return; }
    el.textContent = text; el.className = 'msg ' + (kind || 'error'); show(el, true);
  }

  var state = { connected: false, licensed: false, otaReady: false, version: '', updating: false };
  var statusTimer = null;

  // ---------- Status ----------
  async function loadStatus() {
    try {
      var r = await fetch(BASE_URL + '/api/pendant/status');
      if (!r.ok) return;
      var d = await r.json();
      var usb = d.usbPendant;
      state.connected = !!usb;
      state.licensed = !!(usb && usb.licensed);
      state.otaReady = !!d.otaReady;
      state.version = usb && usb.version ? usb.version : '';
      renderStatus(d);
    } catch (e) { /* transient */ }
  }

  function renderStatus(d) {
    var card = $('statusCard'), title = $('statusTitle'), sub = $('statusSub'), badge = $('statusBadge');
    if (state.connected) {
      var kind = d.activeConnectionType === 'espnow' ? 'Wireless' : 'USB';
      card.className = 'status-card ok';
      title.textContent = 'Pendant connected';
      sub.textContent = kind + (state.version ? ' · v' + state.version : '');
      badge.textContent = kind;
    } else {
      card.className = 'status-card';
      title.textContent = 'Pendant not connected';
      sub.textContent = 'Plug in the pendant or pair it in the Wireless USB dialog';
      badge.textContent = '';
    }
    show($('notConnectedNote'), !state.connected);
    show($('activateBlock'), state.connected && !state.licensed);
    show($('licensedBlock'), state.connected && state.licensed);
    $('fwCurrent').textContent = state.version || '—';
    show($('otaNote'), state.connected && !state.otaReady);
  }

  // ---------- Activation ----------
  $('activateBtn').addEventListener('click', async function () {
    var id = $('installationId').value.trim();
    if (!id) return;
    var btn = $('activateBtn');
    btn.disabled = true; btn.textContent = 'Activating…'; setMsg($('activationMsg'), '');
    try {
      var r = await fetch(BASE_URL + '/api/pendant/activate-usb', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ installationId: id })
      });
      if (!r.ok) { var e = await r.json().catch(function(){return{};}); throw new Error(e.error || e.message || ('Activation failed (HTTP ' + r.status + ')')); }
      $('installationId').value = '';
      setMsg($('activationMsg'), 'Pendant activated.', 'success');
      await loadStatus();
    } catch (e) { setMsg($('activationMsg'), e.message || 'Activation failed', 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Activate'; }
  });

  $('deactivateBtn').addEventListener('click', async function () {
    var btn = $('deactivateBtn');
    btn.disabled = true; btn.textContent = 'Deactivating…'; setMsg($('activationMsg'), '');
    try {
      var r = await fetch(BASE_URL + '/api/pendant/deactivate-usb', { method: 'POST' });
      if (!r.ok) { var e = await r.json().catch(function(){return{};}); throw new Error(e.error || e.message || 'Deactivation failed'); }
      await loadStatus();
    } catch (e) { setMsg($('activationMsg'), e.message || 'Deactivation failed', 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Deactivate'; }
  });

  // ---------- Firmware ----------
  $('checkBtn').addEventListener('click', async function () {
    var btn = $('checkBtn');
    btn.disabled = true; btn.textContent = 'Checking…'; setMsg($('fwMsg'), '');
    try {
      var r = await fetch(BASE_URL + '/api/pendant/firmware/check');
      if (!r.ok) { var e = await r.json().catch(function(){return{};}); throw new Error(e.error || 'Check failed'); }
      var info = await r.json();
      $('fwCurrent').textContent = info.currentVersion || state.version || '—';
      if (info.updateAvailable && info.latestVersion) {
        $('fwLatest').textContent = 'Latest v' + info.latestVersion + ' available';
        $('fwUpdateVer').textContent = 'v' + info.latestVersion;
        show($('updateBtn'), true);
      } else {
        $('fwLatest').textContent = 'Up to date';
        show($('updateBtn'), false);
      }
    } catch (e) { setMsg($('fwMsg'), e.message || 'Could not check for updates', 'error'); }
    finally { btn.disabled = false; btn.textContent = 'Check for updates'; }
  });

  $('updateBtn').addEventListener('click', function () { runFirmware('/api/pendant/firmware/update', null); });

  $('flashToggle').addEventListener('click', function () {
    var p = $('flashPanel'); p.classList.toggle('hidden');
  });
  $('fwFile').addEventListener('change', function () {
    $('flashFileBtn').disabled = !($('fwFile').files && $('fwFile').files[0]);
  });
  $('flashFileBtn').addEventListener('click', async function () {
    var f = $('fwFile').files && $('fwFile').files[0];
    if (!f) return;
    var buf = await f.arrayBuffer();
    runFirmware('/api/pendant/firmware/flash-file', buf);
  });
  $('fwCancelBtn').addEventListener('click', async function () {
    try { await fetch(BASE_URL + '/api/pendant/firmware/cancel', { method: 'POST' }); } catch (e) {}
    endFirmware();
    setMsg($('fwMsg'), 'Firmware update cancelled', 'error');
  });

  function beginFirmware() {
    state.updating = true;
    show($('fwIdle'), false); show($('fwProgressBlock'), true);
    $('fwBar').style.width = '0%'; $('fwStatusText').textContent = 'Starting…'; setMsg($('fwMsg'), '');
  }
  function endFirmware() {
    state.updating = false;
    show($('fwProgressBlock'), false); show($('fwIdle'), true);
  }

  async function runFirmware(path, body) {
    beginFirmware();
    try {
      var opts = body
        ? { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: body }
        : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' };
      var r = await fetch(BASE_URL + path, opts);
      if (!r.ok || !r.body) { var e = await r.json().catch(function(){return{};}); throw new Error(e.error || 'Firmware update failed'); }
      var reader = r.body.getReader(), decoder = new TextDecoder(), buffer = '';
      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        var lines = buffer.split('\n'); buffer = lines.pop() || '';
        for (var i = 0; i < lines.length; i++) {
          if (lines[i].indexOf('data: ') !== 0) continue;
          var ev; try { ev = JSON.parse(lines[i].substring(6)); } catch (e) { continue; }
          if (ev.type === 'progress') {
            $('fwBar').style.width = (ev.percent || 0) + '%';
            $('fwStatusText').textContent = ev.status || 'Flashing firmware…';
          } else if (ev.type === 'complete') {
            $('fwBar').style.width = '100%'; endFirmware();
            setMsg($('fwMsg'), 'Firmware updated' + (ev.version ? ' to v' + ev.version : '') + '. The pendant is rebooting.', 'success');
            show($('updateBtn'), false);
            return;
          } else if (ev.type === 'error') { throw new Error(ev.message || 'Firmware update failed'); }
        }
      }
      endFirmware();
    } catch (e) { endFirmware(); setMsg($('fwMsg'), e.message || 'Firmware update failed', 'error'); }
  }

  // ---------- Init ----------
  $('installationId').addEventListener('keyup', function (e) { if (e.key === 'Enter') $('activateBtn').click(); });
  loadStatus();
  statusTimer = setInterval(function () { if (!state.updating) loadStatus(); }, 3000);
  window.addEventListener('beforeunload', function () { if (statusTimer) clearInterval(statusTimer); });
})();
</script>
</body>
</html>
